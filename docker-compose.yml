# Dev infrastructure — backend/frontend run locally; ts-analyzer is optional (Phase 2).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeintel}
      POSTGRES_USER: ${POSTGRES_USER:-codeintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeintel-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-codeintel} -d $${POSTGRES_DB:-codeintel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ts-analyzer:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./analyzers/ts-analyzer:/app
    command: sh -c "npm ci && npm run build && npm start"
    environment:
      TS_ANALYZER_HOST: 0.0.0.0
      TS_ANALYZER_PORT: 3040
    ports:
      - "127.0.0.1:3040:3040"

  tree-analyzer:
    # tree-sitter needs native build tooling (python3/make/g++), so use the full Debian image.
    image: node:24
    working_dir: /app
    volumes:
      - ./analyzers/tree-analyzer:/app
    command: sh -c "npm ci && npm run build && npm start"
    environment:
      TREE_ANALYZER_HOST: 0.0.0.0
      TREE_ANALYZER_PORT: 3041
    ports:
      - "127.0.0.1:3041:3041"

volumes:
  postgres-data:
