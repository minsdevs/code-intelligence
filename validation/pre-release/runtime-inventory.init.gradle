import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardOpenOption
import java.security.MessageDigest

// Resolution metadata only, no project classes are loaded. Output is restricted
// to a new file in the original repository's validation/local/pre-release-final.
gradle.projectsEvaluated {
    rootProject.tasks.register('candidateRuntimeInventory') {
        doLast {
            def repository = rootProject.projectDir.parentFile.canonicalFile.toPath()
            def repositoryOwner = Files.getOwner(repository, LinkOption.NOFOLLOW_LINKS)
            def name = rootProject.findProperty('candidateInventoryOutput')
            if (!(name instanceof String) || !(name ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,79}\.json/)) throw new GradleException('INVENTORY_OUTPUT_NAME_REFUSED')
            def current = repository
            ['validation', 'local', 'pre-release-final'].each { part ->
                current = current.resolve(part)
                if (!Files.exists(current, LinkOption.NOFOLLOW_LINKS)) {
                    Files.createDirectory(current)
                    Files.setPosixFilePermissions(current, java.nio.file.attribute.PosixFilePermissions.fromString('rwx------'))
                }
                if (Files.isSymbolicLink(current) || !Files.isDirectory(current, LinkOption.NOFOLLOW_LINKS)
                    || current.toRealPath() != current || Files.getOwner(current, LinkOption.NOFOLLOW_LINKS) != repositoryOwner) throw new GradleException('INVENTORY_OUTPUT_PARENT_REFUSED')
                def permissions = Files.getPosixFilePermissions(current)
                if (permissions.contains(java.nio.file.attribute.PosixFilePermission.GROUP_WRITE)
                    || permissions.contains(java.nio.file.attribute.PosixFilePermission.OTHERS_WRITE)) throw new GradleException('INVENTORY_OUTPUT_PARENT_REFUSED')
            }
            if (Files.exists(current.resolve(name), LinkOption.NOFOLLOW_LINKS)) throw new GradleException('INVENTORY_OUTPUT_EXISTS')
            def modules = rootProject.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                def file = artifact.file
                if (!file.isFile() || file.length() > 512L * 1024 * 1024) throw new GradleException('INVENTORY_ARTIFACT_REFUSED')
                def digest = MessageDigest.getInstance('SHA-256')
                file.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                [groupId: id.group, artifactId: id.name, version: id.version, fileName: file.name,
                 classifier: artifact.classifier, sha256: digest.digest().encodeHex().toString()]
            }.sort { a, b -> (a.groupId + ':' + a.artifactId + ':' + a.version + ':' + a.fileName) <=> (b.groupId + ':' + b.artifactId + ':' + b.version + ':' + b.fileName) }
            def result = [format: 1, kind: 'RESOLVED_GRADLE_RUNTIME_ARTIFACTS', offline: gradle.startParameter.offline,
                scope: 'runtimeClasspath artifacts; match SHA256 against packaged nested JARs before using coordinates',
                completeSbom: false, components: modules]
            Files.writeString(current.resolve(name), JsonOutput.prettyPrint(JsonOutput.toJson(result)) + '\n',
                StandardOpenOption.CREATE_NEW, StandardOpenOption.WRITE)
            Files.setPosixFilePermissions(current.resolve(name), java.nio.file.attribute.PosixFilePermissions.fromString('rw-------'))
            println('RUNTIME_INVENTORY_WRITTEN ' + modules.size())
        }
    }
}
