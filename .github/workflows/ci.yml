name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-contract:
    name: Offline validation runner contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node --test validation/t00/test/*.test.cjs

  desktop:
    name: Desktop runtime regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare private Java runtime for native lock tests
        shell: bash
        run: |
          ci_java_home="$(mktemp -d "$RUNNER_TEMP/desktop-java.XXXXXX")"
          cp -a "$JAVA_HOME/." "$ci_java_home/"
          for executable in java javac jar; do
            resolved="$(realpath "$ci_java_home/bin/$executable")"
            case "$resolved" in "$ci_java_home"/*) ;; *) exit 1 ;; esac
            test -f "$resolved" && test -x "$resolved"
          done
          chmod -R go-w "$ci_java_home"
          "$ci_java_home/bin/java" -version
          echo "JAVA_HOME=$ci_java_home" >> "$GITHUB_ENV"
          echo "$ci_java_home/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop test dependencies without native install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check src/main.cjs && node --check src/preload.cjs && node --check src/backup.cjs && node --check scripts/stage-runtime.mjs && node --check scripts/runtime-stage.cjs
      - run: npm test

  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            analyzers/ts-analyzer/package-lock.json
            analyzers/tree-analyzer/package-lock.json
            frontend/package-lock.json
      - name: Install analyzer dependencies for the quality gate
        working-directory: .
        run: |
          npm --prefix analyzers/ts-analyzer ci
          npm --prefix analyzers/tree-analyzer ci
      - name: Format check, tests, build
        run: ./gradlew spotlessCheck build
      - name: Summarize failed backend tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in sorted(Path('build/test-results').glob('**/TEST-*.xml')):
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = ' '.join(failure.get('message', '').split())[:1000]
                      print(f"- {case.get('classname')}::{case.get('name')}: {message}")
          PY
      - name: Install source-viewer gate dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Snapshot source contract (real backend and browser)
        run: ./gradlew snapshotSourceTest
      - name: Multi-language quality and performance regression gate
        run: ../quality-gate

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  ts-analyzer:
    name: ts-analyzer (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/ts-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: analyzers/ts-analyzer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  tree-analyzer:
    name: tree-analyzer (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzers/tree-analyzer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: analyzers/tree-analyzer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
