name: Native acceptance (disposable OS)

on:
  # Same-repository PRs can execute this new workflow before default-branch registration.
  # Never use pull_request_target or execute a fork's source with privileged credentials.
  pull_request:
    paths:
      - '.github/workflows/native-acceptance.yml'
      - 'desktop/**'
      - 'backend/src/main/**/config/**'
      - 'backend/src/main/**/security/**'
      - 'backend/src/main/resources/application-desktop.*'
      - 'analyzers/ts-analyzer/src/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Native product target on a disposable hosted OS (unsigned; release gates remain separate)
        required: true
        type: choice
        options: [macos-arm64, windows-2025, both]
      build_sequence:
        description: Reviewed positive build sequence (must match the build being accepted)
        required: true
        type: string
      disposable_os_consent:
        description: Allow synthetic app data and OS credential-store entries on fresh hosted machines only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  macos:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.disposable_os_consent && (inputs.platform == 'macos-arm64' || inputs.platform == 'both'))
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CODE_INTELLIGENCE_BUILD_SEQUENCE: ${{ inputs.build_sequence || github.run_number }}
      NATIVE_ACCEPTANCE_CONSENT: disposable-hosted-os
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable native UI display
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node -e "const context = require('./desktop/scripts/native-acceptance-context.cjs').requireExecutionContext(); if (context.kind !== 'github-hosted') throw new Error('HOSTED_DISPLAY_PREPARATION_REQUIRED');"
          display_work="$(mktemp -d "$RUNNER_TEMP/native-display.XXXXXX")"
          trap 'rm -rf "$display_work"' EXIT
          cat > "$display_work/display.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          let environment = ProcessInfo.processInfo.environment
          guard environment["GITHUB_ACTIONS"] == "true",
                environment["RUNNER_ENVIRONMENT"] == "github-hosted",
                environment["NATIVE_ACCEPTANCE_CONSENT"] == "disposable-hosted-os",
                environment["NATIVE_ACCEPTANCE_CONTEXT"] == nil else {
              print("HOSTED_DISPLAY_PREPARATION_REQUIRED")
              exit(2)
          }
          _ = NSApplication.shared
          let display = CGMainDisplayID()
          // Reserve frame, menu and Dock space beyond the largest 1440x900 content capture.
          let minimumWorkWidth = 1460, minimumWorkHeight = 960
          func geometry() -> [String: Int] {
              guard let screen = NSScreen.screens.first(where: {
                  ($0.deviceDescription[NSDeviceDescriptionKey("NSScreenNumber")] as? NSNumber)?.uint32Value == display
              }) else { return [:] }
              return ["width": Int(screen.frame.width), "height": Int(screen.frame.height),
                      "workWidth": Int(screen.visibleFrame.width), "workHeight": Int(screen.visibleFrame.height)]
          }
          func sufficient(_ value: [String: Int]) -> Bool {
              (value["workWidth"] ?? 0) >= minimumWorkWidth && (value["workHeight"] ?? 0) >= minimumWorkHeight
          }
          var report: [String: Any] = ["format": 1, "requiredContent": [1440, 900],
              "minimumWorkArea": [minimumWorkWidth, minimumWorkHeight], "before": geometry(), "changed": false]
          func finish(_ code: String, _ status: Int32) -> Never {
              report["status"] = status == 0 ? "PASS" : "FAIL"
              report["code"] = code
              report["after"] = geometry()
              let data = try! JSONSerialization.data(withJSONObject: report, options: [.sortedKeys])
              print(String(decoding: data, as: UTF8.self))
              FileHandle.standardError.write(Data((code + "\n").utf8))
              exit(status)
          }
          if sufficient(geometry()) { finish("NATIVE_DISPLAY_ALREADY_SUFFICIENT", 0) }
          let modes = (CGDisplayCopyAllDisplayModes(display, nil) as? [CGDisplayMode] ?? []).prefix(256)
          report["availableLogicalSizes"] = modes.map { [$0.width, $0.height] }
          guard let selected = modes.filter({ $0.width >= 1920 && $0.height >= 1080
              && $0.width <= 32768 && $0.height <= 32768 && $0.isUsableForDesktopGUI() })
              .min(by: { $0.width * $0.height < $1.width * $1.height }) else {
              finish("NATIVE_DISPLAY_SUPPORTED_MODE_UNAVAILABLE", 3)
          }
          var configuration: CGDisplayConfigRef?
          guard CGBeginDisplayConfiguration(&configuration) == .success, let configuration else {
              finish("NATIVE_DISPLAY_CONFIGURATION_UNAVAILABLE", 3)
          }
          let configured = CGConfigureDisplayWithDisplayMode(configuration, display, selected, nil)
          guard configured == .success else {
              CGCancelDisplayConfiguration(configuration)
              finish("NATIVE_DISPLAY_CONFIGURATION_FAILED", 3)
          }
          guard CGCompleteDisplayConfiguration(configuration, .forSession) == .success else {
              finish("NATIVE_DISPLAY_SESSION_APPLY_FAILED", 3)
          }
          report["changed"] = true
          report["selectedLogicalSize"] = [selected.width, selected.height]
          let deadline = Date().addingTimeInterval(5)
          while !sufficient(geometry()) && Date() < deadline {
              RunLoop.current.run(until: Date().addingTimeInterval(0.1))
          }
          finish(sufficient(geometry()) ? "NATIVE_DISPLAY_PREPARED" : "NATIVE_DISPLAY_WORK_AREA_INSUFFICIENT",
                 sufficient(geometry()) ? 0 : 3)
          SWIFT
          /usr/bin/xcrun swiftc "$display_work/display.swift" -o "$display_work/display"
          mkdir -p "$RUNNER_TEMP/native-acceptance-artifacts"
          "$display_work/display" > "$RUNNER_TEMP/native-acceptance-artifacts/display.json"
      - name: Provision verified native runtime (no background services)
        timeout-minutes: 8
        run: bash desktop/scripts/native-acceptance-macos.sh
      - name: Build current source and exercise native app
        timeout-minutes: 18
        run: node desktop/scripts/native-acceptance.cjs macos
      - name: Preserve credential-free diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  windows:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.disposable_os_consent && (inputs.platform == 'windows-2025' || inputs.platform == 'both'))
    runs-on: windows-2025
    # Keep setup and evidence upload outside the bounded standard-user run.
    timeout-minutes: 38
    env:
      CODE_INTELLIGENCE_BUILD_SEQUENCE: ${{ inputs.build_sequence || github.run_number }}
      NATIVE_ACCEPTANCE_CONSENT: disposable-hosted-os
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Run real native boundaries under a new standard-user token
        # Allow up to 2 minutes of logon, 30 minutes of work, then owned cleanup.
        timeout-minutes: 34
        shell: pwsh
        run: ./desktop/scripts/native-acceptance-windows.ps1
      - name: Preserve credential-free diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-2025-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-acceptance-artifacts/provisioning.json
            ${{ runner.temp }}/native-acceptance-artifacts/acceptance.json
            ${{ runner.temp }}/native-acceptance-artifacts/token.json
            ${{ runner.temp }}/native-acceptance-artifacts/windows-native.json
            ${{ runner.temp }}/native-acceptance-artifacts/windows-native-build.log
            ${{ runner.temp }}/native-acceptance-artifacts/windows-safe-storage.json
            ${{ runner.temp }}/native-acceptance-artifacts/first-start-980x700.png
            ${{ runner.temp }}/native-acceptance-artifacts/first-start-1280x800.png
            ${{ runner.temp }}/native-acceptance-artifacts/first-start-1440x900.png
            ${{ runner.temp }}/native-acceptance-artifacts/project-list-980x700.png
            ${{ runner.temp }}/native-acceptance-artifacts/project-list-1280x800.png
            ${{ runner.temp }}/native-acceptance-artifacts/project-list-1440x900.png
            ${{ runner.temp }}/native-acceptance-artifacts/after-delete-980x700.png
            ${{ runner.temp }}/native-acceptance-artifacts/after-delete-1280x800.png
            ${{ runner.temp }}/native-acceptance-artifacts/after-delete-1440x900.png
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  consent:
    if: github.event_name == 'workflow_dispatch' && !inputs.disposable_os_consent
    runs-on: ubuntu-latest
    steps:
      - name: Refuse missing explicit consent
        run: echo 'Disposable hosted OS consent is required.'; exit 1
