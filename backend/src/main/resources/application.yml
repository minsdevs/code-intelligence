spring:
  application:
    name: code-intelligence-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeintel}
    username: ${DB_USERNAME:codeintel}
    password: ${DB_PASSWORD:codeintel-local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    data:
      redis:
        namespace: codeintel:session

server:
  port: ${SERVER_PORT:8080}
  # Personal local tool: bind loopback only (sc 1-1 finding); override for container deploys.
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Required (no default): TokenCryptoService fails fast at startup when missing or invalid.
  token-enc-key: ${TOKEN_ENC_KEY:}
  data-dir: ${DATA_DIR:${user.home}/.code-intelligence}
  snapshot-retention: 2
  analysis:
    max-files: ${ANALYSIS_MAX_FILES:20000}
    max-file-size: ${ANALYSIS_MAX_FILE_SIZE:1048576}
    max-commits: ${ANALYSIS_MAX_COMMITS:10000}
    github-rate-limit-retries: ${ANALYSIS_GITHUB_RATE_LIMIT_RETRIES:5}
    github-backoff-base-ms: ${ANALYSIS_GITHUB_BACKOFF_BASE_MS:1000}
    feature-merge-threshold: ${ANALYSIS_FEATURE_MERGE_THRESHOLD:0.5}
  auth:
    pat-login-max-attempts: ${PAT_LOGIN_MAX_ATTEMPTS:20}
    pat-login-window-seconds: ${PAT_LOGIN_WINDOW_SECONDS:60}
  desktop:
    # Per-launch API token and stable local identity are injected by the desktop process.
    api-token: ${DESKTOP_API_TOKEN:}
    # Main-process capability; never exposed through the renderer preload.
    path-token: ${DESKTOP_PATH_TOKEN:}
    local-identity: ${DESKTOP_LOCAL_IDENTITY:}
    allowed-origin: ${DESKTOP_ALLOWED_ORIGIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  github:
    base-url: https://api.github.com
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    native-oauth:
      # Public OAuth app with device flow enabled. Never package a client secret.
      client-id: ${GITHUB_NATIVE_CLIENT_ID:}
      device-code-uri: ${GITHUB_DEVICE_CODE_URI:https://github.com/login/device/code}
      token-uri: ${GITHUB_TOKEN_URI:https://github.com/login/oauth/access_token}
      attempt-ttl-seconds: ${GITHUB_OAUTH_ATTEMPT_TTL_SECONDS:300}
  ts-analyzer:
    base-url: ${TS_ANALYZER_BASE_URL:}
    timeout-seconds: ${TS_ANALYZER_TIMEOUT_SECONDS:30}
    tls-cert-sha256: ${TS_ANALYZER_TLS_CERT_SHA256:}
    auth-token: ${TS_ANALYZER_AUTH_TOKEN:}
    control-socket: ${TS_ANALYZER_CONTROL_SOCKET:}
    control-capability: ${TS_ANALYZER_CONTROL_CAPABILITY:}
  tree-analyzer:
    base-url: ${TREE_ANALYZER_BASE_URL:}
    timeout-seconds: ${TREE_ANALYZER_TIMEOUT_SECONDS:30}
  local-import:
    allowed-roots: ${LOCAL_IMPORT_ALLOWED_ROOTS:}
  ai:
    provider: ${AI_PROVIDER:}
    max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:8000}
    daily-token-limit: ${AI_DAILY_TOKEN_LIMIT:500000}
    focus-line-window: ${AI_FOCUS_LINE_WINDOW:40}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embed-model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
      chat-models: ${OPENAI_CHAT_MODELS:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
      embed-model: ${GEMINI_EMBED_MODEL:gemini-embedding-001}
      chat-models: ${GEMINI_CHAT_MODELS:}

---
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        secure: true
