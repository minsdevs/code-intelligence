spring:
  application:
    name: code-intelligence-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeintel}
    username: ${DB_USERNAME:codeintel}
    password: ${DB_PASSWORD:codeintel-local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    data:
      redis:
        namespace: codeintel:session

server:
  port: ${SERVER_PORT:8080}
  # Personal local tool: bind loopback only (sc 1-1 finding); override for container deploys.
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Required (no default): TokenCryptoService fails fast at startup when missing or invalid.
  token-enc-key: ${TOKEN_ENC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  github:
    base-url: https://api.github.com
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}

---
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        secure: true
