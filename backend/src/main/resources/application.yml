spring:
  application:
    name: code-intelligence-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeintel}
    username: ${DB_USERNAME:codeintel}
    password: ${DB_PASSWORD:codeintel-local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
